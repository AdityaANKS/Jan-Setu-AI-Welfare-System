[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Optional: If you host the FastAPI backend on Render/Railway/Fly.io,
# you can either set VITE_API_BASE in Netlify Environment Variables
# OR uncomment the proxy rule below with your backend URL.
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-jansetu-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
